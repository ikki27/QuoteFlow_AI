name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ruff==0.17.6
      - name: Ruff (backend)
        run: ruff check .
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: ESLint (frontend)
        run: npm run lint
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Testi backenda s pokritostjo
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          pip install -r requirements.txt
          python -m pytest -q --cov=app --cov-report=term --cov-report=html

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Testi frontenda s pokritostjo
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - name: Shrani poročila o pokritosti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            backend/htmlcov/
            frontend/coverage/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Gradnja frontenda
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Gradnja backenda
        working-directory: backend
        run: |
          pip install -r requirements.lock.txt
          python -m compileall -q app
          mkdir -p build
          cp -r app requirements.lock.txt build/
      - uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/build/
